<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인화 포털 대시보드 | My Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
    <style>
        .drag-over {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            color: #3b82f6 !important;
        }
        .slot-transition { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-brand-600 text-white p-2 rounded-lg"><i class="fa-solid fa-border-all"></i></div>
                <h1 class="text-xl font-bold text-slate-900">My Workspace Portal</h1>
            </div>
            <div class="flex items-center gap-4 text-sm text-slate-500">
                <span class="hidden sm:inline"><i class="fa-solid fa-circle-info mr-1"></i> 빈 슬롯에 링크를 드래그 앤 드롭하거나 클릭하세요.</span>
                
                <!-- GitHub 업로드 버튼 -->
                <button id="github-upload-btn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg font-medium transition-colors shadow-sm">
                    <i class="fa-brands fa-github"></i> GitHub에 저장
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div id="dashboard-container" class="grid grid-cols-1 gap-8">
            <!-- Categories injected here -->
        </div>
    </main>

    <!-- Modal for Manual Entry -->
    <div id="link-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-200" id="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900">새 링크 추가</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">사이트 이름 (Title)</label>
                    <input type="text" id="link-title" placeholder="예: Google" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">URL 주소</label>
                    <input type="url" id="link-url" placeholder="https://example.com" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button id="cancel-btn" class="px-4 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg font-medium transition-colors">취소</button>
                <button id="save-btn" class="px-4 py-2 text-white bg-brand-600 hover:bg-brand-700 rounded-lg font-medium transition-colors shadow-sm">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        const SLOTS_PER_CATEGORY = 4;
        const categories = [
            { id: 'work', title: 'Work', icon: 'fa-briefcase', color: 'text-blue-600' },
            { id: 'study', title: 'Study', icon: 'fa-book-open', color: 'text-green-600' },
            { id: 'entertainment', title: 'Entertainment', icon: 'fa-gamepad', color: 'text-purple-600' },
            { id: 'misc', title: 'Misc', icon: 'fa-folder-open', color: 'text-orange-600' }
        ];

        let portalData = { customTitles: {} };
        let currentEditInfo = { categoryId: null, slotIndex: null };

        const container = document.getElementById('dashboard-container');
        const modal = document.getElementById('link-modal');
        const modalContent = document.getElementById('modal-content');
        const inputTitle = document.getElementById('link-title');
        const inputUrl = document.getElementById('link-url');
        const closeBtn = document.getElementById('close-modal-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const saveBtn = document.getElementById('save-btn');

        function init() {
            loadData();
            renderDashboard();
            setupModalEvents();
            document.getElementById('github-upload-btn').addEventListener('click', uploadToGitHub);
        }

        function loadData() {
            try {
                const stored = localStorage.getItem('myPortalData');
                if (stored) portalData = JSON.parse(stored);
            } catch (e) {
                console.error("데이터 불러오기 오류", e);
            }

            if (!portalData.customTitles) portalData.customTitles = {};

            categories.forEach(cat => {
                if (!portalData[cat.id] || !Array.isArray(portalData[cat.id])) {
                    portalData[cat.id] = Array(SLOTS_PER_CATEGORY).fill(null);
                }
            });
        }

        function saveData() {
            localStorage.setItem('myPortalData', JSON.stringify(portalData));
        }

        function renderDashboard() {
            container.innerHTML = '';

            categories.forEach(category => {
                const section = document.createElement('section');
                section.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-6';

                const currentTitle = portalData.customTitles[category.id] || category.title;

                const header = document.createElement('div');
                header.className = 'flex items-center gap-3 mb-6 group';
                header.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center ${category.color} flex-shrink-0">
                        <i class="fa-solid ${category.icon} text-lg"></i>
                    </div>
                    <div class="flex items-center relative">
                        <input type="text" 
                            class="category-title-input text-xl font-bold text-slate-800 bg-transparent border-b-2 border-transparent hover:border-slate-300 focus:border-brand-500 focus:bg-slate-50 outline-none w-full max-w-[250px] px-1 py-0.5 rounded transition-colors cursor-text" 
                            value="${currentTitle}" 
                            data-cat-id="${category.id}"
                            placeholder="카테고리 이름"
                            title="클릭하여 이름 수정"
                        >
                        <i class="fa-solid fa-pen text-slate-300 ml-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-sm"></i>
                    </div>
                `;
                section.appendChild(header);

                const titleInput = header.querySelector('.category-title-input');
                titleInput.addEventListener('change', (e) => {
                    const newTitle = e.target.value.trim();
                    if (newTitle) {
                        portalData.customTitles[category.id] = newTitle;
                    } else {
                        e.target.value = category.title;
                        portalData.customTitles[category.id] = category.title;
                    }
                    saveData();
                });

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 md:grid-cols-4 gap-4';

                const slots = portalData[category.id];
                for (let i = 0; i < SLOTS_PER_CATEGORY; i++) {
                    grid.appendChild(createSlotElement(category.id, i, slots[i]));
                }

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function createSlotElement(categoryId, slotIndex, data) {
            const slot = document.createElement('div');
            
            if (data) {
                slot.className = 'group relative border border-slate-200 bg-slate-50 rounded-xl p-4 flex flex-col justify-center items-center text-center h-28 slot-transition hover:border-brand-300 hover:shadow-md cursor-pointer';
                
                let domain = '';
                try { domain = new URL(data.url).hostname; } catch(e) { domain = data.url; }

                slot.innerHTML = `
                    <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="absolute inset-0 z-10 rounded-xl"></a>
                    <div class="w-10 h-10 bg-white shadow-sm border border-slate-100 rounded-full flex items-center justify-center mb-2 text-brand-600">
                        <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" alt="favicon" class="w-5 h-5 rounded-sm" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2NiZDVlMSI+PHBhdGggZD0iTTEyIDJDMiAyIDIgMTIgMiAxMnMy IDEw IDEw IDEw IDEwIDEwLTEw IDEwLTEwUzIyIDIgMTIgMnptMCAxOGMtNC40MSAwLTgtMy41OS04LThzMy41OS04IDgtOCA4IDMuNTkgOCA4LTMuNTkgOC04 IDh6Ii8+PC9zdmc+'" />
                    </div>
                    <h3 class="font-semibold text-slate-800 text-sm truncate w-full px-2">${data.title}</h3>
                    <p class="text-xs text-slate-400 truncate w-full px-2 mt-0.5">${domain}</p>
                    
                    <button class="delete-btn absolute top-2 right-2 w-7 h-7 bg-white text-red-500 rounded-full shadow-sm opacity-0 group-hover:opacity-100 transition-opacity z-20 flex items-center justify-center hover:bg-red-50">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;

                slot.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    deleteLink(categoryId, slotIndex);
                });

            } else {
                slot.className = 'border-2 border-dashed border-slate-300 hover:border-brand-400 bg-white rounded-xl flex flex-col justify-center items-center h-28 cursor-pointer text-slate-400 hover:text-brand-500 hover:bg-brand-50 slot-transition';
                slot.innerHTML = `
                    <i class="fa-solid fa-plus text-xl mb-2"></i>
                    <span class="text-sm font-medium">링크 추가</span>
                `;

                slot.addEventListener('click', () => openModal(categoryId, slotIndex));
                setupDragAndDrop(slot, categoryId, slotIndex);
            }

            return slot;
        }

        function setupDragAndDrop(slotEl, categoryId, slotIndex) {
            slotEl.addEventListener('dragover', (e) => {
                e.preventDefault();
                slotEl.classList.add('drag-over');
            });

            slotEl.addEventListener('dragleave', (e) => {
                e.preventDefault();
                slotEl.classList.remove('drag-over');
            });

            slotEl.addEventListener('drop', (e) => {
                e.preventDefault();
                slotEl.classList.remove('drag-over');

                let url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
                url = url ? url.split('\n')[0].trim() : '';

                if (isValidUrl(url)) {
                    let title = "새 링크";
                    try { title = new URL(url).hostname.replace('www.', ''); } catch(e){}
                    addLink(categoryId, slotIndex, title, url);
                } else {
                    alert("유효한 웹사이트 주소가 아닙니다.");
                }
            });
        }

        function isValidUrl(string) {
            try { new URL(string); return true; } catch (_) { return false; }
        }

        function addLink(categoryId, slotIndex, title, url) {
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
            portalData[categoryId][slotIndex] = { title, url };
            saveData();
            renderDashboard();
        }

        function deleteLink(categoryId, slotIndex) {
            portalData[categoryId][slotIndex] = null;
            saveData();
            renderDashboard();
        }

        function openModal(categoryId, slotIndex) {
            currentEditInfo = { categoryId, slotIndex };
            inputTitle.value = '';
            inputUrl.value = '';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            inputTitle.focus();
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        function setupModalEvents() {
            closeBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            saveBtn.addEventListener('click', () => {
                const title = inputTitle.value.trim();
                const url = inputUrl.value.trim();

                if (!title || !url) return alert("이름과 URL 주소를 모두 입력해주세요.");
                addLink(currentEditInfo.categoryId, currentEditInfo.slotIndex, title, /^https?:\/\//i.test(url) ? url : 'https://' + url);
                closeModal();
            });

            inputUrl.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveBtn.click(); });
            inputTitle.addEventListener('keypress', (e) => { if (e.key === 'Enter') inputUrl.focus(); });
        }

        // ----------------------------------------------------
        // 완벽히 수정된 GitHub 업로드 함수
        // ----------------------------------------------------
        async function uploadToGitHub() {
            const btn = document.getElementById('github-upload-btn');
            const originalText = '<i class="fa-brands fa-github"></i> GitHub에 저장';

            try {
                // 1. 토큰 가져오기 또는 입력받기
                let token = localStorage.getItem('gh_upload_token');
                if (!token) {
                    token = prompt('GitHub Personal Access Token (PAT)을 입력하세요:\n(repo 권한 필수)');
                    if (!token) return; // 사용자가 취소 시 조용히 복구
                    
                    token = token.trim();
                    if (confirm('이 토큰을 브라우저에 저장하여 계속 사용하시겠습니까?')) {
                        localStorage.setItem('gh_upload_token', token);
                    }
                }

                const owner = 'jjkwean'; 
                const repo = 'main';    
                const path = 'index.html';

                // UI 상태 전환
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 업로드 중...';
                btn.disabled = true;

                // 2. 최신 데이터(portalData) 소스코드 인젝션
                let currentHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                const dataJsonStr = JSON.stringify(portalData);
                
                currentHtml = currentHtml.replace(
                    /let portalData = \{ customTitles: \{\} \};/,
                    `let portalData = ${dataJsonStr};`
                );

                // 3. UTF-8 안전 Base64 변환
                const base64Content = btoa(unescape(encodeURIComponent(currentHtml)));
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

                // 4. SHA 조회
                let sha = '';
                const getRes = await fetch(apiUrl, {
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                } else if (getRes.status === 401) {
                    alert('❌ 토큰 인증에 실패했습니다 (401). 올바른 토큰을 다시 입력하세요.');
                    localStorage.removeItem('gh_upload_token');
                    return;
                } else if (getRes.status !== 404) {
                    const errData = await getRes.json();
                    alert(`❌ 기존 파일 정보 조회 실패 (${getRes.status}): ${errData.message}`);
                    return;
                }

                // 5. GitHub API PUT (덮어쓰기 요청)
                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: 'chore: Update dashboard layout and items data',
                        content: base64Content,
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) {
                    alert('✅ 성공적으로 GitHub 저장소 파일에 동기화되었습니다!');
                } else {
                    const errData = await putRes.json();
                    alert(`❌ 업로드 실패 (${putRes.status}): ${errData.message}`);
                }

            } catch (err) {
                console.error('GitHub Upload Error:', err);
                alert('⚠️ 통신 중 오류가 발생했습니다.');
            } finally {
                // 성공/실패/취소 등 어떤 상황에서도 버튼 상태를 100% 무조건 원래대로 복구
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
