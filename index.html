<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인화 포털 대시보드 | My Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
    <style>
        .drag-over {
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
            color: #3b82f6 !important;
        }
        .slot-transition { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-brand-600 text-white p-2 rounded-lg"><i class="fa-solid fa-border-all"></i></div>
                <h1 class="text-xl font-bold text-slate-900">My Workspace Portal</h1>
            </div>
            <div class="flex items-center gap-4 text-sm text-slate-500">
                <span class="hidden sm:inline"><i class="fa-solid fa-circle-info mr-1"></i> 빈 슬롯에 링크를 드래그 앤 드롭하거나 클릭하세요.</span>
                
                <button id="github-upload-btn" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg font-medium transition-colors shadow-sm">
                    <i class="fa-brands fa-github"></i> GitHub에 저장
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div id="dashboard-container" class="grid grid-cols-1 gap-8">
            <!-- 카테고리 렌더링 영역 -->
        </div>
    </main>

    <!-- 새 링크 추가 모달 -->
    <div id="link-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-200" id="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900">새 링크 추가</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">사이트 이름 (Title)</label>
                    <input type="text" id="link-title" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">URL 주소</label>
                    <input type="url" id="link-url" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button id="cancel-btn" class="px-4 py-2 text-slate-600 bg-slate-100 rounded-lg font-medium">취소</button>
                <button id="save-btn" class="px-4 py-2 text-white bg-brand-600 rounded-lg font-medium">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        // === PORTAL DATA START ===
        let portalData = {"customTitles":{},"work":[null,null,{"title":"https://jjkwean.github.io/class/","url":"https://jjkwean.github.io/class/"},null],"study":[null,null,null,{"title":"https://jjkwean.github.io/math_middle_one/","url":"https://jjkwean.github.io/math_middle_one/"}],"entertainment":[null,null,null,null],"misc":[null,null,null,null]};
        // === PORTAL DATA END ===

        const SLOTS_PER_CATEGORY = 4;
        const categories = [
            { id: 'work', title: 'Work', icon: 'fa-briefcase', color: 'text-blue-600' },
            { id: 'study', title: 'Study', icon: 'fa-book-open', color: 'text-green-600' },
            { id: 'entertainment', title: 'Entertainment', icon: 'fa-gamepad', color: 'text-purple-600' },
            { id: 'misc', title: 'Misc', icon: 'fa-folder-open', color: 'text-orange-600' }
        ];

        let currentEditInfo = { categoryId: null, slotIndex: null };
        const container = document.getElementById('dashboard-container');
        const modal = document.getElementById('link-modal');
        const modalContent = document.getElementById('modal-content');
        const inputTitle = document.getElementById('link-title');
        const inputUrl = document.getElementById('link-url');

        function init() {
            loadData();
            renderDashboard();
            setupModalEvents();
            document.getElementById('github-upload-btn').addEventListener('click', uploadToGitHub);
        }

        function loadData() {
            try {
                const stored = localStorage.getItem('myPortalData');
                if (stored) portalData = JSON.parse(stored);
            } catch (e) {}

            if (!portalData.customTitles) portalData.customTitles = {};
            categories.forEach(cat => {
                if (!portalData[cat.id]) portalData[cat.id] = Array(SLOTS_PER_CATEGORY).fill(null);
            });
        }

        function saveData() {
            localStorage.setItem('myPortalData', JSON.stringify(portalData));
        }

        function renderDashboard() {
            container.innerHTML = '';
            categories.forEach(category => {
                const section = document.createElement('section');
                section.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-6';

                const currentTitle = portalData.customTitles[category.id] || category.title;
                const header = document.createElement('div');
                header.className = 'flex items-center gap-3 mb-6 group';
                header.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center ${category.color} flex-shrink-0"><i class="fa-solid ${category.icon} text-lg"></i></div>
                    <input type="text" class="text-xl font-bold text-slate-800 bg-transparent border-b-2 border-transparent hover:border-slate-300 focus:border-brand-500 outline-none w-full max-w-[250px] px-1" value="${currentTitle}">
                `;
                section.appendChild(header);

                header.querySelector('input').addEventListener('change', (e) => {
                    portalData.customTitles[category.id] = e.target.value.trim() || category.title;
                    saveData();
                });

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 md:grid-cols-4 gap-4';

                portalData[category.id].forEach((data, index) => {
                    grid.appendChild(createSlotElement(category.id, index, data));
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function createSlotElement(categoryId, slotIndex, data) {
            const slot = document.createElement('div');
            if (data) {
                let domain = '';
                try { domain = new URL(data.url).hostname; } catch(e) { domain = data.url; }
                slot.className = 'group relative border border-slate-200 bg-slate-50 rounded-xl p-4 flex flex-col justify-center items-center text-center h-28 hover:border-brand-300 hover:shadow-md cursor-pointer';
                slot.innerHTML = `
                    <a href="${data.url}" target="_blank" class="absolute inset-0 z-10"></a>
                    <div class="w-10 h-10 bg-white shadow-sm border border-slate-100 rounded-full flex items-center justify-center mb-2"><img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" class="w-5 h-5" /></div>
                    <h3 class="font-semibold text-slate-800 text-sm truncate w-full px-2">${data.title}</h3>
                    <p class="text-xs text-slate-400 truncate w-full px-2 mt-0.5">${domain}</p>
                    <button class="delete-btn absolute top-2 right-2 w-7 h-7 bg-white text-red-500 rounded-full shadow-sm opacity-0 group-hover:opacity-100 z-20"><i class="fa-solid fa-trash-can text-xs"></i></button>
                `;
                slot.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.preventDefault(); e.stopPropagation();
                    portalData[categoryId][slotIndex] = null;
                    saveData(); renderDashboard();
                });
            } else {
                slot.className = 'border-2 border-dashed border-slate-300 hover:border-brand-400 bg-white rounded-xl flex flex-col justify-center items-center h-28 cursor-pointer text-slate-400 hover:text-brand-500 hover:bg-brand-50';
                slot.innerHTML = `<i class="fa-solid fa-plus text-xl mb-2"></i><span class="text-sm font-medium">링크 추가</span>`;
                slot.addEventListener('click', () => openModal(categoryId, slotIndex));
            }
            return slot;
        }

        function openModal(categoryId, slotIndex) {
            currentEditInfo = { categoryId, slotIndex };
            inputTitle.value = ''; inputUrl.value = '';
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.replace('scale-95', 'scale-100'); }, 10);
            inputTitle.focus();
        }

        function closeModal() {
            modal.classList.add('opacity-0'); modalContent.classList.replace('scale-100', 'scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
        }

        function setupModalEvents() {
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('cancel-btn').addEventListener('click', closeModal);
            document.getElementById('save-btn').addEventListener('click', () => {
                const title = inputTitle.value.trim();
                const url = inputUrl.value.trim();
                if (!title || !url) return alert("이름과 URL 주소를 모두 입력해주세요.");
                
                let finalUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
                portalData[currentEditInfo.categoryId][currentEditInfo.slotIndex] = { title, url: finalUrl };
                saveData(); renderDashboard(); closeModal();
            });
        }

        // ==========================================
        // 🚀 완벽히 개선된 즉시 반영 업로드 로직
        // ==========================================
        async function uploadToGitHub() {
            const btn = document.getElementById('github-upload-btn');
            const originalText = '<i class="fa-brands fa-github"></i> GitHub에 저장';

            try {
                let token = localStorage.getItem('gh_upload_token');
                if (!token) {
                    token = prompt('GitHub Personal Access Token (PAT)을 입력하세요:\n(권한: repo)');
                    if (!token || !token.trim()) return;
                    if (confirm('토큰을 브라우저에 저장하시겠습니까?')) localStorage.setItem('gh_upload_token', token.trim());
                }
                
                const owner = 'jjkwean'; 
                const repo = 'main';    
                const path = 'index.html';

                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 업로드 중...';
                btn.disabled = true;

                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
                
                // 1. GitHub에서 깨끗한 원본 HTML 파일을 불러옵니다 (DOM 캡처 버그 원천 차단)
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' } });
                if (getRes.status === 401) {
                    alert('❌ 인증 실패: 토큰이 만료되었거나 잘못되었습니다.');
                    localStorage.removeItem('gh_upload_token');
                    return;
                }
                const fileData = await getRes.json();
                
                // 2. Base64 디코딩 (한글 깨짐 방지 처리)
                let decodedHtml = decodeURIComponent(escape(atob(fileData.content)));
                
                // 3. 파일 내용 중 데이터 구역(PORTAL DATA)만 찾아서 최신 링크 데이터로 덮어쓰기
                const newDataBlock = `// === PORTAL DATA START ===\n        let portalData = ${JSON.stringify(portalData)};\n        // === PORTAL DATA END ===`;
                decodedHtml = decodedHtml.replace(/\/\/ === PORTAL DATA START ===[\s\S]*?\/\/ === PORTAL DATA END ===/, newDataBlock);

                // 4. 다시 Base64 인코딩 후 GitHub로 업로드
                const base64Content = btoa(unescape(encodeURIComponent(decodedHtml)));
                const putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'Update portal links', content: base64Content, sha: fileData.sha })
                });

                if (putRes.ok) {
                    // 클라이언트 즉시 반영 효과를 위해 페이지 강제 새로고침
                    alert('✅ 성공적으로 저장되었습니다!\nGitHub Pages 배포까지 약 1~2분이 소요될 수 있습니다.');
                    location.href = location.pathname + "?v=" + new Date().getTime(); 
                } else {
                    alert('❌ 저장에 실패했습니다.');
                }
            } catch (err) {
                alert('⚠️ 통신 오류가 발생했습니다.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
